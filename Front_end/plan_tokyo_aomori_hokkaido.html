<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Trip Planner · Explore Japan</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <!-- This page moved: every trip is now planned on /plan.html (any cities, any order).
       Old links keep working: saved trips (?itineraryId=...) open there, a new trip
       starts with this page's cities, and an unsaved draft from this page is carried over. -->
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      if (!params.has("itineraryId")) {
        params.set("cities", "tokyo,aomori,hakodate,sapporo");
        params.set("draft", "tokyoAomoriHokkaidoPlan");
      }
      location.replace("/plan.html?" + params.toString());
    })();
  </script>
</head>
<body>
  <p style="font-family: system-ui, sans-serif; padding: 2rem">
    The trip planner has moved. <a href="/plan.html?cities=tokyo,aomori,hakodate,sapporo">Open the planner</a>.
  </p>
</body>
</html>
